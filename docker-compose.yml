services:
  db:
    image: postgres:16-alpine
    container_name: detective-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: detective-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # À l'intérieur du réseau Docker, l'api joint Postgres via le nom de
      # service "db" sur son port interne (5432) — pas via localhost ni le
      # port hôte 5433 mappé ci-dessus. Écrase le DATABASE_URL du env_file.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
