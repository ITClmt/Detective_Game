<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #0A0E13; color: #E7ECF2; }
  a { color: #E3B563; text-decoration: none; }
  a:hover { color: #F2CD8A; }
  input { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  input::placeholder { color: #4E5B69; }
  input:focus { outline: none; border-color: #E3B563 !important; background: #131C25 !important; }
</style>
</helmet>

<div style="position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:64px 24px;box-sizing:border-box;background:#0A0E13;font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden">

  <div style="position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 0%, rgba(227,181,99,.11), transparent 62%);pointer-events:none"></div>
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 14px,transparent 14px 28px);pointer-events:none"></div>
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:760px;height:760px;border:1px solid rgba(227,181,99,.07);border-radius:50%;pointer-events:none"></div>
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;height:520px;border:1px solid rgba(227,181,99,.05);border-radius:50%;pointer-events:none"></div>
  <div style="position:absolute;inset:0;box-shadow:inset 0 0 240px 100px rgba(0,0,0,.9);pointer-events:none"></div>

  <div style="position:relative;width:100%;max-width:472px">

    <div style="text-align:center;margin-bottom:34px">
      <a href="Landing.dc.html" style="font-family:'Zilla Slab',serif;font-weight:700;font-size:26px;letter-spacing:.04em;color:#E7ECF2" style-hover="color:#E3B563">NOIR CASE</a>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;color:#5F6C7A;margin-top:10px">ACCÈS AU DOSSIER</div>
    </div>

    <div style="border:1px solid #24303C;background:#111821;box-shadow:0 50px 110px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.02) inset">

      <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #24303C">
        <button type="button" onClick="{{ showLogin }}" style="{{ loginTabStyle }}">CONNEXION</button>
        <button type="button" onClick="{{ showRegister }}" style="{{ registerTabStyle }}">INSCRIPTION</button>
      </div>

      <div style="padding:36px 36px 34px">

        <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
          <div>
            <h1 style="font-family:'Zilla Slab',serif;font-weight:600;font-size:27px;line-height:1.25;margin:0 0 8px">Reprendre l'enquête</h1>
            <p style="font-size:14px;line-height:1.6;color:#7D8A98;margin:0 0 30px">Vos dossiers en cours vous attendent.</p>

            <div style="display:flex;flex-direction:column;gap:20px">
              <label style="display:flex;flex-direction:column;gap:9px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:#93A1B0">EMAIL</span>
                <input type="email" autocomplete="email" placeholder="detective@exemple.fr" style="background:#0D141B;border:1px solid #24303C;color:#E7ECF2;font-size:15px;padding:14px 15px;transition:border-color .15s,background .15s" />
              </label>
              <label style="display:flex;flex-direction:column;gap:9px">
                <span style="display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:#93A1B0">MOT DE PASSE
                  <a href="#" style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:#5F6C7A" style-hover="color:#E3B563">OUBLIÉ ?</a>
                </span>
                <input type="password" autocomplete="current-password" placeholder="••••••••" style="background:#0D141B;border:1px solid #24303C;color:#E7ECF2;font-size:15px;padding:14px 15px;letter-spacing:.08em;transition:border-color .15s,background .15s" />
              </label>

              <button type="button" style="margin-top:6px;background:#E3B563;color:#0A0E13;border:1px solid #E3B563;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;padding:16px;cursor:pointer;transition:background .15s" style-hover="background:#F2CD8A">SE CONNECTER</button>
            </div>

            <div style="margin-top:26px;padding-top:22px;border-top:1px solid #1A232D;font-size:13px;color:#7D8A98;text-align:center">Pas encore de dossier ?
              <button type="button" onClick="{{ showRegister }}" style="background:none;border:none;color:#E3B563;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;padding:0 0 1px;border-bottom:1px solid rgba(227,181,99,.4)">Créer un compte</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
          <div>
            <h1 style="font-family:'Zilla Slab',serif;font-weight:600;font-size:27px;line-height:1.25;margin:0 0 8px">Ouvrir un dossier</h1>
            <p style="font-size:14px;line-height:1.6;color:#7D8A98;margin:0 0 30px">Votre première affaire commence tout de suite.</p>

            <div style="display:flex;flex-direction:column;gap:20px">
              <label style="display:flex;flex-direction:column;gap:9px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:#93A1B0">NOM D'UTILISATEUR</span>
                <input type="text" autocomplete="username" placeholder="Sam Kovacs" style="background:#0D141B;border:1px solid #24303C;color:#E7ECF2;font-size:15px;padding:14px 15px;transition:border-color .15s,background .15s" />
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5F6C7A">3 à 32 caractères</span>
              </label>
              <label style="display:flex;flex-direction:column;gap:9px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:#93A1B0">EMAIL</span>
                <input type="email" autocomplete="email" placeholder="detective@exemple.fr" style="background:#0D141B;border:1px solid #24303C;color:#E7ECF2;font-size:15px;padding:14px 15px;transition:border-color .15s,background .15s" />
              </label>
              <label style="display:flex;flex-direction:column;gap:9px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:#93A1B0">MOT DE PASSE</span>
                <input type="password" autocomplete="new-password" placeholder="••••••••" style="background:#0D141B;border:1px solid #24303C;color:#E7ECF2;font-size:15px;padding:14px 15px;letter-spacing:.08em;transition:border-color .15s,background .15s" />
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;color:#5F6C7A">6 à 32 caractères — une majuscule, une minuscule, un chiffre, un caractère spécial (@ $ ! % * ? &amp;)</span>
              </label>
              <label style="display:flex;flex-direction:column;gap:9px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:#93A1B0">CONFIRMER LE MOT DE PASSE</span>
                <input type="password" autocomplete="new-password" placeholder="••••••••" style="background:#0D141B;border:1px solid #24303C;color:#E7ECF2;font-size:15px;padding:14px 15px;letter-spacing:.08em;transition:border-color .15s,background .15s" />
              </label>

              <button type="button" style="margin-top:6px;background:#E3B563;color:#0A0E13;border:1px solid #E3B563;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;padding:16px;cursor:pointer;transition:background .15s" style-hover="background:#F2CD8A">CRÉER MON COMPTE</button>
            </div>

            <div style="margin-top:26px;padding-top:22px;border-top:1px solid #1A232D;font-size:13px;color:#7D8A98;text-align:center">Déjà un dossier ouvert ?
              <button type="button" onClick="{{ showLogin }}" style="background:none;border:none;color:#E3B563;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;padding:0 0 1px;border-bottom:1px solid rgba(227,181,99,.4)">Se connecter</button>
            </div>
          </div>
        </sc-if>

      </div>
    </div>

    <div style="text-align:center;margin-top:26px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.8;letter-spacing:.1em;color:#4E5B69">
      <a href="Landing.dc.html" style="color:#5F6C7A" style-hover="color:#E3B563">← RETOUR À L'ACCUEIL</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;defaultMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;register&quot;],&quot;default&quot;:&quot;login&quot;,&quot;tsType&quot;:&quot;'login' | 'register'&quot;,&quot;section&quot;:&quot;Formulaire&quot;}}">
class Component extends DCLogic {
  state = { mode: null };

  get mode() {
    return this.state.mode ?? this.props.defaultMode ?? "login";
  }

  tabStyle(active) {
    return {
      background: active ? "#111821" : "#0D141B",
      color: active ? "#E3B563" : "#7D8A98",
      border: "none",
      borderBottom: active ? "2px solid #E3B563" : "2px solid transparent",
      fontFamily: "'IBM Plex Mono', monospace",
      fontSize: "12px",
      letterSpacing: "0.18em",
      padding: "18px 0",
      cursor: "pointer",
      transition: "color .15s, background .15s",
    };
  }

  renderVals() {
    const m = this.mode;
    return {
      isLogin: m === "login",
      isRegister: m === "register",
      loginTabStyle: this.tabStyle(m === "login"),
      registerTabStyle: this.tabStyle(m === "register"),
      showLogin: () => this.setState({ mode: "login" }),
      showRegister: () => this.setState({ mode: "register" }),
    };
  }
}

</script>
</body>
</html>
